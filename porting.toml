[[area]]
id = "packaging"
status = "planned"
components = ["SoftwareAES", "AppleKeyStoreState"]
paths = ["patches/**", "package/userland/**", "package/prelink/**", "package/aea/**", "scripts/package.sh", "scripts/install-os-profile.sh", "scripts/build-kernel.sh", "scripts/fetch-kernelcache.sh", "scripts/fetch-kdk-kernel.sh", "scripts/kdk-reference.py", "scripts/aea-decrypt.py", "scripts/apply-unixnu-patches.sh", "package/Kit.toml"]
inputs = ["patches/xnu/0001-0002 from HakiOS (against xnu-8796.121.2 plus HakiOS's core patch); UniXNU's arch series (written for xnu-10063)."]
configuration = ["board.toml selects soc, os and device series; the OS series os-profiles/ios-16.5-20F66/patches/xnu/series replaces arch:patches/xnu/series. Device patch series lists the HakiOS patches commented out."]
procedure = ["scripts/apply-unixnu-patches.sh; scripts/install-os-profile.sh; scripts/fetch-kernelcache.sh; then scripts/build-kernel.sh (unixnu build kernel, merge_fileset_maps.py, unixnu prelink, nopac-kernel.py), ./unixnu payload --trust-cache out/ipsw/24A446/trustcache-iphone13.bundle and ./unixnu bootimg from the UniXNU checkout."]
findings = ["UniXNU's 56 ARM64 patches against xnu-8796.121.2 (2026-11-12): 44 apply unchanged and are referenced from UniXNU (arch:); 5 are ported in os-profiles/ios-16.5-20F66/patches/xnu-8796 (apple-only-cpu-tunables, external-archive-dependencies, native-aes-personality, source-machine-layer, zzx-pmap-sync-64bit-pa); 3 do not apply to xnu-8796 (pgz-aligned-validation, public-entitlements-header, published-freezer-condition); 4 iPadOS 17 owner/addon/cryptex patches are left out. Both XnuPrelink patches apply unchanged. The resolved 51-patch order applies cleanly to a fresh xnu-8796.121.2 tree.", "zzx-pmap-sync-64bit-pa matters on apollo: 4 GiB of DRAM lies above 4 GiB.", "With UniXNU's Linux toolchain (2026-11-12) xnu-8796.121.2 compiles and links (mach.development.bcm2837) after seven more OS-profile patches: clang-drop-auto-var-init-acknowledgement and clang-uio-stackbuf (current clang), iorpc-kernel-content (the toolchain's iig emits xnu-10063 DriverKit glue), kalloc-pointee-type (os_get_pointee_type backport for C++ void pointers), arm64-kpc-from-xnu-10063 (the 8796 source release omits osfmk/arm64/kpc.c; non-Apple stubs), compile-records (clang -MJ, which the archive builders read) and pthread-jit-entitled-callback (UniXNU's libpthread 519.120.4). ArmDTPlatform, ArmCpu, SoftwareAES, RamBlock, AppleKeyStoreState, corecrypto and libpthread then build against xnu-8796.", "Prelink stops on the iOS 16.5 kernelcache (sha256 e6fa7559...): emit_prelink finds external PC-relative encodings in inline data. With its existing catalogue applied (SHA-256 K, Adler-32 vectors and the Libm pools all match iOS 16.5 too), only 8 words remain, all in com.apple.kec.Libm __TEXT_EXEC (va 0xfffffff005b8d000): 0x11cc, 0x11dc, 0x11ec, 0x11fc and 0x1490, 0x14a0, 0x14d4, 0x14ec. They lie in one block of double-precision constants that starts after the RET at 0x1050 and is read through ADR (targets 0x1068, 0x107c, 0x1088, 0x109c, 0x10c4, 0x14cc). Libm has no symbols, LC_FUNCTION_STARTS or ADRP data references, and no BL target delimits the block end yet.", "The Libm block ends at 0x1520 (2026-11-13): 0x1054-0x1520, 1228 bytes, after the RET at 0x1050 and before the next function's stp x29, x30, [sp, #-0x10]!; 0x151c is zero padding. Libm reads it only through ADR and LDR (literal) from 0xc90-0x1024, and no direct branch lands in it (the boundary rule of UniXNU's scripts/audit-target-libm-inline-data.py). It is the iOS 16.5 counterpart of the iPadOS pool at 0xf60-0x1440. package/prelink/emit_prelink_ios16_5.py adds it (prefix 0000807f0000004100008040db0f493f, sha256 73df5b75...c385f) to emit_prelink.MATH_LITERAL_POOLS, and the OS profile's [kernel.prelink] tool points to it. Prelink then emits kernel.macho (55599104 bytes, sha256 545a58d6...3ee3): 235530 PC-relative encodings preserved, executable bytes unchanged, runtime_qualified and loadable false.", "UniXNU build caching: patches that change exported headers do not reach .cache/fakeroot until its .xnu-<version>-headers stamp and the startup.o.json record are removed.", "The HakiOS apollo drivers depend on HakiOS's shared core patch (input, QMI, lx, audio plug-in layers), which is not in this repository.", "2026-11-13, iOS 27.0.1 on Linux: UniXNU's Linux kernel step is written for the arm64 iOS 17 profile. patches/unixnu/linux-arm64e.patch (against UniXNU 7d85ede, scripts/apply-unixnu-patches.sh) makes it follow the profile: DARWIN_TRIPLE and SDK version from the arch and OS profiles, -fptrauth-function-pointer-type-discrimination and the __ARM_ARCH_8_2__/8_3__ macros Apple clang predefines for arm64e, libcc_kext built for the kernel slice, and build-fileset-release-reference.py ported (host make arguments, the Linux source rewrites before it copies the tree, llvm-lto of the toolchain's LLVM 58c46ba in place of ld's LTO -r step, which cctools-port's ld64 cannot do). Upstream clang has no 4-argument __ptrauth: nopac-upstream-clang-ptrauth-null.patch.", "The 27 profile does not link without UniXNU-sheng's device series: its bring-up patch defines what the 24A446 prelink fixtures bind (unixnu_kernel_stack_shift, ...). The series is carried in patches/xnu-12377/sheng/ (1108068); apollo-board-hooks.patch defines the three board hooks it declares weak, which an arm64e link cannot leave undefined.", "Prelink naming on Linux: with UniXNU's RELEASE reference built by upstream clang + llvm-lto the matcher names 2265 of 3046 kext-facing targets and leaves 40 missing and 1000 stubbed (UniXNU's policy for an Xcode build: 2 and 24); the first boot panicked in corecrypto on an unmapped kernel function. With Apple's kernel.release.t8142 of the macOS 27.0.1 KDK (26A434, xnu-13432.1.9; the kernelcache's kernel is xnu-13432.2.10 RELEASE_ARM64_T8142) and its dSYM's symbols as the reference it names 2755. package/prelink/merge_fileset_maps.py runs the unchanged matcher with both and merges: 5 missing, 53 stubbed. The profile passes the merged map with --fileset-map; its regression_policy is commented out.", "The IPSW's OS and Cryptex1,SystemOS images are AEA archives; UniXNU decrypts them with macOS /usr/bin/aea. package/aea/aea-decrypt.c (OpenSSL HPKE and HKDF, lzfse, lzbitmap; every HMAC verified) with scripts/aea-decrypt.py does it on Linux: OS 9,472,835,584 bytes and SystemOS 5,498,732,544 bytes, both raw APFS containers, which fit the 20 GiB darwin partition. 7-Zip reads them (7z x -tapfs)."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["kernel.macho is an experimental prelink candidate with 5 missing and 53 stubbed kext-to-kernel references; emit_prelink does not qualify runtime behaviour.", "The RELEASE reference archive is commented out in board.toml ([kernel] archives, #REF): it is a naming aid, takes 15 minutes of LTO, and its last build under tree/build/xnu/fileset-reference is reused.", "No userdata image, no Data seed, no runtime payload yet."]
next_action = ["Get past machine_lockdown (area arm64e-nopac), then build the userdata image from the two decrypted images and pin their volume UUIDs."]
