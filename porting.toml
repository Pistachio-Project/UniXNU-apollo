[[area]]
id = "arm64e-nopac"
status = "implemented"
components = ["XnuPrelink"]
paths = ["package/pacstrip/**", "scripts/nopac-kernel.py"]
inputs = ["tools/pacstrip and kernel/pacstrip of mateusseiboth/darwin-lisa (MIT), the arm64e rewrite for a CPU without pointer authentication; the phone's CPUs: Cortex-A77 and Cortex-A55, /proc/cpuinfo features fp asimd aes pmull sha1 sha2 crc32 atomics fphp asimdhp cpuid asimdrdm lrcpc dcpop asimddp (no PAuth, JSCVT, FCMA, DIT, FlagM)."]
configuration = ["The kernel is built as arm64e exactly as on a SoC with pointer authentication, so the kexts keep their ABI and UniXNU's prelink applies. nopac-native-keys.patch defines NATIVE_PAC_STRIPPED for BCM2837: the key registers and the SCTLR_EL1 key enables are never written. scripts/nopac-kernel.py then rewrites the linked collection.", "User code: nopac-user-text.patch puts executable mappings of arm64e images (exec and mmap) behind the apple-protect pager with a transform that rewrites only the image's code sections; the pager validates the signed page first, so code signing stays enforced. nopac-emulate.patch emulates what still traps (EL0 and EL1): PAC forms, LDRAA/LDRAB, FJCVTZS, DIT, SB, FlagM."]
procedure = ["cd package/pacstrip && python3 -m unittest (47 tests: the rewrite table against llvm-mc, the C rewriter and the emulator compiled from the patches); scripts/nopac-kernel.py after the prelink; package/pacstrip/cachemap.py scan DIRECTORY for a dyld shared cache."]
findings = ["PAC*, AUT* and XPAC* become NOP, the authenticated branches and loads their plain forms, PACGA a deterministic EOR; a pointer is then never signed, and the kernel's own signing code (thread state, chained fixups, the dyld and shared region pagers) stores plain pointers without further patches.", "The rewrite must go by where code is, not by section attributes: xnu's __KLD,__text (arm_init's rebase and sign code) has no instruction attribute, and UniXNU's collection keeps the whole original __TEXT_EXEC while listing only the selected kexts. Missing the first hung the kernel in arm_init; nopac-kernel.py now rewrites every section of executable non-__TEXT segments and the collection's own executable segments (738,006 instructions) and refuses an image with any left.", "Apple's corecrypto kext hashes its own __text in its power-on self-test (HMAC-SHA256, one zero byte as key, compared with __TEXT,__fips_hmacs); after the rewrite the kernel panicked with FIPS Kernel POST Failed (-2074). nopac-kernel.py stores the value again (the algorithm reproduces Apple's stored value on the untouched kernelcache).", "The 24A446 kernelcache has 729,275 PAC instructions and none that need emulation. The iPhone13,1 dyld shared cache (74 files, 4684 images): 32,456,241 instructions to rewrite in 4559 code ranges, 1142 left to the emulator, and 20,869 data words in executable mappings that look like PAC instructions, so a rewrite of whole mappings would corrupt data.", "On the phone (2026-11-13): the rewritten collection passes VM, zone, scheduler, OSLog, corecrypto POST, PE_init_iokit and IONVRAM and stops at the machine_lockdown stage (arm_vm_prot_finalize / ml_release_deferred_pages) 0.22 s after the log opens, without panic text; the phone resets about 6 s later. The ADT properties UniXNU-sheng sets (kernel-ctrr-to-be-enabled 0, vmm-present, sleep-disabled, kern.maxvnodes) did not change it."]
completion = ["launchd and the daemons of the unchanged iOS 27 images run on the A77 with code signing enforced, with no instruction left that the CPU lacks outside the emulator's reach."]
limits = ["The shared cache's executable mappings are not behind the pager yet, so no arm64e user process can run.", "The user-text pager and the emulator have not executed on the phone.", "Inline data inside kext text (Libm constant blocks) is rewritten like code if a word looks like a PAC instruction; none has been seen to matter."]
next_action = ["Find the stop in machine_lockdown (stage marks inside arm_vm_prot_finalize; compare the memory window and the 4 KiB block split with UniXNU-sheng).", "Build the shared cache's code ranges when the cache is mapped and hook vm_shared_region_map_file."]
evidence = [
  { kind = "host", command = "cd package/pacstrip && python3 -m unittest; scripts/build-kernel.sh", revision = "d3802fae034cb2c6ac2f4d7ddf48a440c089263c", reference = "https://github.com/Pistachio-Project/UniXNU-apollo/commit/d3802fae034cb2c6ac2f4d7ddf48a440c089263c", result = "CachyOS, /opt/unixnu-linux toolchain: 47 tests pass; the 24A446 collection (95,158,272 bytes) is emitted with 5 missing and 53 stubbed references and rewritten: 738,006 instructions, none left in executable segments, corecrypto kext HMAC stored again, source corecrypto sealed again." },
  { kind = "device", command = "./unixnu payload --trust-cache out/ipsw/24A446/trustcache-iphone13.bundle; ./unixnu bootimg; scripts/bootcycle.sh fileset-6", revision = "d3802fae034cb2c6ac2f4d7ddf48a440c089263c", reference = "https://github.com/Pistachio-Project/UniXNU-apollo/commit/d3802fae034cb2c6ac2f4d7ddf48a440c089263c", result = "Xiaomi Mi 10T M2007J3SY, RELEASE firmware uefi-apollo f072eb8, fastboot boot from RAM: Darwin Kernel Version 25.5.0 DEVELOPMENT_ARM64_BCM2837 runs on the Cortex-A77 through VM bootstrap, zone_init, OSLog, corecrypto POST, PE_init_iokit, IONVRAM and early_boot; the last stage in the log is machine_lockdown at 0.225 s, no panic text, the phone resets and LineageOS returns 4716 bytes of console through pstore." },
]

[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["scripts/check-*", "scripts/probe-*", "scripts/probe.sh", "scripts/bootcycle.sh"]
inputs = ["HakiOS's driver traces (frame pacing, hitch tracer) and the firmware log exporter."]
configuration = ["apollo_frames=1 apollo_hitch=1 in the HakiOS patches."]
procedure = ["Follow https://unixnu.com/porting/log-capture."]
findings = ["HakiOS traced animation hitches of 65-235 ms to frames arriving late from CoreAnimation, not to the display or GPU path.", "2026-11-13: the kernel console comes back without a serial port. apollo-bootlog.patch copies the console and kprintf into Android's ramoops console zone (boot-args bootlog=0xb0000000 bootlog-size=0x200000) in Linux's persistent_ram layout; after the reset LineageOS publishes it as /sys/fs/pstore/console-ramoops-0 (a few flipped bits per kilobyte after a reset). bootlog-reset=N resets through PSCI after N seconds, a panic resets 5 s after its text, bootlog-wdt=0x17c10000 feeds the watchdog the firmware armed, and the stage names of UniXNU's boot-progress patch are written with a time stamp. scripts/bootcycle.sh runs one cycle (adb reboot bootloader, fastboot boot, wait for Android, pull the log) in about 45 s with no key press.", "UniXNU's entry probe works on the Linux-built kernel for the stage bars and the timed reset (scripts/probe.sh asks one reset-after question); its panic screen does not fit: the code is 0xa27 bytes and the padding after the kernel entry ends 0x57 bytes short."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["The log needs the kernel to reach arm_vm_init's end; before that only the entry probe speaks."]
next_action = ["Enable the firmware log exporter in uefi-apollo."]
evidence = [
  { kind = "device", command = "scripts/bootcycle.sh", revision = "d3802fae034cb2c6ac2f4d7ddf48a440c089263c", reference = "https://github.com/Pistachio-Project/UniXNU-apollo/commit/d3802fae034cb2c6ac2f4d7ddf48a440c089263c", result = "Mi 10T, LineageOS: six consecutive cycles (adb reboot bootloader, fastboot boot of a 119 MB image, kernel run, self reset, console pulled from /sys/fs/pstore/console-ramoops-0) of about 45 s each without a key press; a panic text and the timed stage marks are readable in the pulled log." },
]
