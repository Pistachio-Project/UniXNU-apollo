schema_version = 1

[device]
name = "apollo"
soc = "SM8250"
os_profile = "ios-27.0.1-24A446"
summary = "Branch ios27: iOS 27.0.1 (arm64e only) on a SoC without pointer authentication. The arm64e kernel with Apple's 24A446 kexts builds on Linux, is rewritten for the Cortex-A77/A55 and boots on the phone as far as machine_lockdown; no root, no user space yet. The iOS 16.5 record of the HakiOS migration is on main."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "os-profiles/**", ".github/**", ".gitignore", "local.toml.example", "unixnu.lock", "LICENSE", "NOTICE", "package/LICENSE.MIT"]
inputs = ["Pistachio-Project/UniXNU-sm8250-common at 90fa1fd; xnu-8796.121.2 (c54f35c); the iOS 16.5 20F66 iPhone10,3 IPSW."]
configuration = ["board.toml selects SoC sm8250, OS profile ios-16.5-20F66 (os-profiles/, linked by scripts/install-os-profile.sh) and apollo_defconfig."]
procedure = ["scripts/install-os-profile.sh; then from UniXNU: ./unixnu defconfig apollo_defconfig -D ../UniXNU-apollo; ./unixnu fetch; ./unixnu status --json."]
findings = ["UniXNU reads OS profiles only from its own profiles/os/, so the iOS 16.5 profile is linked in until it is contributed upstream.", "The OS cryptex hash 2279bf44... was measured on the HakiOS image and matches UniXNU-nio's published pin for the same IPSW.", "The OS profile now carries its own 51-patch kernel series for xnu-8796, so board.toml no longer selects the xnu-10063 ARM64 series.", "unixnu fetch resolves every source and unixnu status resolves without local overrides (unixnu.lock committed 2026-11-12).", "board.toml [payload.adt] chip_id is the Qualcomm SoC ID, 0x164 (356) as /sys/devices/soc0/soc_id reports on the phone; the ADT generator requires it.", "TOML keys with a dot (kern.maxvnodes) must be quoted in the profile's [adt] tables, or they become nested tables and the ADT generator fails.", "The root image (64354ba3...) matches its pin too; its APFS volume UUID is 97A3EB1A-5218-4936-BC85-9574EC2C8CC9. Both images are seeded in UniXNU's out/ipsw/20F66 cache.", "2026-11-13, branch ios27: the board selects os-profiles/ios-27.0.1-24A446. Its user space is the iPhone13,1 (iPhone 12 mini, 1080x2340) 24A446 IPSW; its kexts come from the iPad17,3 24A446 kernelcache that UniXNU's ipados-27.0.1-24A446 profile is pinned to, so that profile's prelink fixtures and class records apply unchanged. Both IPSWs share out/ipsw/24A446 (scripts/fetch-kernelcache.sh).", "The 27 kernel configuration follows UniXNU-sheng's sheng_ipados27_defconfig: CONFIG_XNU_CRYPTO_BOOTSTRAP=\"source\" (with \"prelinked\" OSKext references source_corecrypto14_* symbols nothing defines), CONFIG_XNU_KERNEL_CHAINED_FIXUPS=y (the prelink emitter relocates the native kernel by them), CONFIG_XNU_DT_PANIC_REGION=y, CONFIG_XNU_ARMVIRT_PLATFORM=n.", "feeds.toml pins UniXNU-sm8250-common 1f4c734 (branch ios27), which adds patches/xnu-12377; local.toml can point the soc source at a sibling checkout instead."]
completion = ["defconfig, fetch and status resolve; status shows arm64, sm8250, ios-16.5-20F66 and device profiles in order with the intended patch order."]
limits = ["The firmware and boot image values have not been through unixnu firmware/bootimg yet."]
next_action = ["Pin the root volume UUIDs and image digests of the iPhone13,1 images in the profile ([root], [payload.adt]); they are still the iPad's."]
evidence = []

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/pull-firmware.sh"]
inputs = ["Pistachio-Project/uefi-apollo: Mu-Silicium apolloPkg from HakiOS (KonaPkg, XBL BOOT.XF.3.2-00304-SM8250-2 drivers).", "The phone's firmware, pulled by scripts/pull-firmware.sh into .cache/firmware (42 files in proprietary-files.txt)."]
configuration = ["[firmware] config apollo, apollo.dsc, FD at 0x9FC00000 size 0x300000."]
procedure = ["scripts/pull-firmware.sh with the phone in LineageOS, rooted adb; ./unixnu firmware -D ../UniXNU-apollo --uefi ../uefi-apollo."]
findings = ["On the phone (2026-11-12, fastboot boot from RAM): the RELEASE firmware reaches the UniXNU menu. Bisected on hardware: with the MdeModulePkg DiskIoDxe/PartitionDxe the firmware hangs on a blank screen, with the phone's prebuilt pair it reaches the menu (uefi-apollo ab70992).", "UniXNU's default boot image header (base 0, 4096-byte pages, tags at 0x1e00000) makes apollo's ABL boot Android instead; Mu-Silicium's mkbootimg values in [bootimg.image] work. A firmware-only image also needs a non-empty ramdisk (uefi-apollo Resources/ramdisk).", "A DEBUG build stops on ASSERT_EFI_ERROR (Out of Resources) in a prebuilt Qualcomm driver's uncached allocation; seen with the MdeModulePkg disk drivers, not retested with the prebuilt pair.", "Under HakiOS the same apolloPkg boots via fastboot boot and hands off to HakiOS's own XNU loader; UniXNU replaces that loader with UniXNU.efi and DarwinBoot.", "uefi-apollo needed sheng's SEC device-tree handoff (entry-argument HOB) and BootShim for UniXNURamDiskDxe and bootimg.py; DiskIo/Partition now come from MdeModulePkg instead of the XBL binaries.", "uefi-apollo f072eb8 (branch ios27): MemoryMapLib reserves Android's ramoops zone (0xB0000000, 4 MiB) and BootWatchdogDxe arms the APSS watchdog (0x17c10000) for 30 s at ExitBootServices. The DEBUG firmware of that tree hit an ArmCpuDxe exception in DXE (undefined instruction while DxeCore changed memory attributes for ShmBridgeDxe/ScmDxe) in one boot of three; the RELEASE build is the one used.", "DarwinBoot answers \"Load error\" when the kernel member of the collection has another CPU subtype than the collection header (0xC0000002, the arm64e kernel ABI bit). cctools-port's ld64 and upstream clang cannot set that bit (0x80000002); scripts/nopac-kernel.py sets it in the emitted image.", "apollo's ABL takes a 119 MB boot image (112 MiB payload) over fastboot boot in about 3 s on the USB 2.0 hub."]
completion = ["Firmware image builds, enters the UniXNU menu, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Only the firmware is verified: no payload, DarwinBoot handoff or XNU yet.", "uefi-apollo bc8f586 builds (RELEASE and DEBUG, 0x300000-byte FD) but has not been booted. The payload must stay inside ABL's reserved Kernel window at 0xA0000000 (256 MiB); check the UNIXNURAMDISK initrd address on first boot."]
next_action = ["Retest the DEBUG build with the prebuilt disk drivers, then boot a payload through DarwinBoot once the kernel builds."]
evidence = [
  { kind = "device", command = "./unixnu firmware --target RELEASE; ./unixnu bootimg --ramdisk ../uefi-apollo/Resources/ramdisk; fastboot boot", revision = "ab70992cdf353d7531df77649740bcce405365f4", reference = "https://github.com/Pistachio-Project/uefi-apollo/commit/ab70992cdf353d7531df77649740bcce405365f4", result = "Xiaomi Mi 10T M2007J3SY, LineageOS ABL: the UniXNU menu appears (no boot entries, no payload)." },
  { kind = "device", command = "./unixnu build firmware --uefi ../uefi-apollo --target RELEASE; ./unixnu bootimg; fastboot boot", revision = "f072eb80b425299fa3ae306b1b706413a30dcc9c", reference = "https://github.com/Pistachio-Project/uefi-apollo/commit/f072eb80b425299fa3ae306b1b706413a30dcc9c", result = "Mi 10T: the RELEASE firmware with the Ramoops reservation and BootWatchdogDxe reaches the UniXNU menu, DarwinBoot hands off a 95 MB kernel collection from a 112 MiB payload, and a kernel that stops is reset without a key press." },
]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/apollo.dts"]
inputs = ["GICv3 at 0x17a00000 / 0x17a60000; eight cores, Affinity1 ids 0x0-0x700; 4 Cortex-A55 + 4 Cortex-A77; EPSS cpufreq domains."]
configuration = ["All eight cpu nodes enabled; E/P cluster types from the SoC DTSI."]
procedure = ["Follow https://unixnu.com/porting/bring-up for CPU entry checkpoints."]
findings = ["HakiOS runs all eight cores and the big cores at full speed (apollo_cpufreq=1) on xnu-8796 with its own SMP patch."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The SMP numbering and cluster patches for xnu-8796 are not in the SoC series yet."]
next_action = ["Split HakiOS's SMP changes into UniXNU-sm8250-common/patches/xnu."]
